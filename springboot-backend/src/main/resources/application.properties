# ============================================================
# DevMind AI – Spring Boot Backend Configuration
# ============================================================

server.port=8080

# ============================================================
# H2 In-Memory Database (DEFAULT — active until Member 5's
# PostgreSQL is ready. Swap the profiles below to switch.)
# ============================================================
spring.datasource.url=jdbc:h2:mem:devminddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console (accessible at http://localhost:8080/h2-console during dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ============================================================
# PostgreSQL Configuration (UNCOMMENT when Member 5 is ready)
# Comment out the H2 section above when switching.
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/devmind
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.h2.console.enabled=false

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# Multipart File Upload Limits (200 MB)
# ============================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ============================================================
# Upload Directory (where extracted ZIPs are stored)
# ============================================================
upload.dir=./uploads

# ============================================================
# FastAPI AI Service URL (Member 3's server)
# ============================================================
fastapi.base-url=http://localhost:8000

# ============================================================
# Logging
# ============================================================
logging.level.com.devmind=DEBUG
logging.level.org.springframework.web=INFO
